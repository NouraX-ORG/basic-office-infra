# Nourax Workspace - Nextcloud + ONLYOFFICE Docs behind Cloudflare Tunnel, files in Cloudflare R2.
# Nothing here publishes a port: the only way in is the Cloudflare Tunnel (service "cloudflared").
# Settings come from .env (copy of .env.example). Secrets are files in ${SECRETS_DIR}.

name: nourax-workspace

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by the Nextcloud web container and its cron container. They must match exactly,
# otherwise cron silently falls back to stale values saved in config.php.
x-nextcloud-env: &nextcloud-env
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  REDIS_HOST_PASSWORD_FILE: /run/secrets/redis_password
  NEXTCLOUD_ADMIN_USER_FILE: /run/secrets/nextcloud_admin_user
  NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
  # "app" lets ONLYOFFICE call Nextcloud inside the Docker network. Only read at first install.
  NEXTCLOUD_TRUSTED_DOMAINS: "${DRIVE_HOST} app"
  # Primary object storage: Cloudflare R2 (extra R2 tuning lives in config/nextcloud/zz-nourax.config.php)
  OBJECTSTORE_S3_BUCKET: ${R2_BUCKET}
  OBJECTSTORE_S3_HOST: ${CF_ACCOUNT_ID}.r2.cloudflarestorage.com
  OBJECTSTORE_S3_REGION: auto
  OBJECTSTORE_S3_PORT: "443"
  OBJECTSTORE_S3_SSL: "true"
  OBJECTSTORE_S3_USEPATH_STYLE: "true"
  OBJECTSTORE_S3_KEY_FILE: /run/secrets/r2_access_key_id
  OBJECTSTORE_S3_SECRET_FILE: /run/secrets/r2_secret_access_key
  # Reverse proxy: only the cloudflared container may set the client IP (CF-Connecting-IP)
  TRUSTED_PROXIES: 172.30.10.10
  FORWARDED_FOR_HEADERS: HTTP_CF_CONNECTING_IP
  APACHE_DISABLE_REWRITE_IP: "1"
  # No OVERWRITEHOST: ONLYOFFICE calls back on http://app/, and that Host must be kept.
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://${DRIVE_HOST}
  PHP_MEMORY_LIMIT: 1024M
  PHP_UPLOAD_LIMIT: 1024M

x-nextcloud-secrets: &nextcloud-secrets
  - postgres_password
  - redis_password
  - nextcloud_admin_user
  - nextcloud_admin_password
  - r2_access_key_id
  - r2_secret_access_key

x-nextcloud-volumes: &nextcloud-volumes
  - nextcloud:/var/www/html
  # Settings are copied into /var/www/html/config by the hook below (never mounted there directly).
  - ./config/nextcloud:/opt/nourax/config:ro
  - ./config/hooks/10-nourax-config.sh:/docker-entrypoint-hooks.d/pre-installation/10-nourax-config.sh:ro
  - ./config/hooks/10-nourax-config.sh:/docker-entrypoint-hooks.d/pre-upgrade/10-nourax-config.sh:ro
  - ./config/hooks/10-nourax-config.sh:/docker-entrypoint-hooks.d/before-starting/10-nourax-config.sh:ro
  - ./branding:/opt/nourax/branding:ro
  # Nourax's own apps; zz-nourax.config.php adds this folder to apps_paths.
  - ./nextcloud-apps:/var/www/html/nourax_apps:ro

services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    user: redis
    # Cache and file locks only, so nothing is written to disk.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --save '' --appendonly no"]
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    image: ${NEXTCLOUD_IMAGE}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *nextcloud-env
    secrets: *nextcloud-secrets
    volumes: *nextcloud-volumes
    healthcheck:
      # The image has no curl, so PHP fetches status.php.
      test: ["CMD", "php", "-r", "$$c = stream_context_create(['http' => ['header' => 'Host: ${DRIVE_HOST}']]); $$s = (string) @file_get_contents('http://localhost/status.php', false, $$c); exit(str_contains($$s, '\"installed\":true') ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging: *logging

  cron:
    image: ${NEXTCLOUD_IMAGE}
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      app: { condition: service_started }
    environment: *nextcloud-env
    secrets: *nextcloud-secrets
    volumes: *nextcloud-volumes
    logging: *logging

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE}
    restart: unless-stopped
    # Community Edition keeps open documents in memory; a graceful stop saves them first.
    stop_grace_period: 5m
    env_file:
      - ${SECRETS_DIR}/onlyoffice.env   # JWT_SECRET=... (the image has no *_FILE support)
    environment:
      JWT_ENABLED: "true"
      # Own header name so it never clashes with Nextcloud's Authorization header.
      JWT_HEADER: AuthorizationJwt
      WOPI_ENABLED: "false"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
      # The official AI plugin ("AI Tools" tab), put there by scripts/onlyoffice-plugins.sh.
      - ${ONLYOFFICE_PLUGINS_DIR:-/opt/nourax/onlyoffice-plugins}/ai:/var/www/onlyoffice/documentserver/sdkjs-plugins/{9DC93CDB-B576-4F0C-B55E-FCC9C48DD007}:ro
    logging: *logging

  # Add-on services (search engine, virus scanner) go below this line.

  # Virus scanner: clamd answers on TCP 3310 inside the compose network only (no port is published).
  # The file server scans every upload with it (files_antivirus, scripts/configure.d/50-virus-scanner.sh)
  # and the NoMail API sends attachments to it. freshclam in the same container keeps the signatures
  # fresh. The _base image has no signatures: the first start downloads them (about 110 MB) into
  # the clamav_db volume. Details: docs/search-and-antivirus.md.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5.4_base}
    restart: unless-stopped
    environment:
      FRESHCLAM_CHECKS: "${FRESHCLAM_CHECKS:-2}"   # look for new signatures twice a day (.env)
      CLAMD_STARTUP_TIMEOUT: "1800"  # seconds the start script waits for clamd to load
    volumes:
      - clamav_db:/var/lib/clamav
      # Our own complete files, not the image's CLAMD_CONF_* variables: its start script appends
      # those to the config file again on every start.
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./config/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    # clamd holds all signatures in memory (about 1 GB). The limit and the higher OOM score make
    # the kernel stop ClamAV first, never the database or the file server, when memory runs out.
    mem_limit: ${CLAMAV_MEM_LIMIT:-1600m}
    oom_score_adj: 400
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]   # PING on port 3310, from the image
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15m                 # first signature download plus loading
    logging: *logging

  # Search engine for "search inside files": Elasticsearch on 9200 inside the compose network only
  # (no port is published). The fulltextsearch apps in the file server send it the text of documents
  # and ask it when someone searches (scripts/configure.d/50-search.sh). One node, so the index has no
  # replicas. Security is on: the file server signs in as "nourax_drive", which may only use the
  # nourax_drive* indexes; the "elastic" superuser is only used by 50-search.sh, inside this container.
  # Details: docs/search-and-antivirus.md.
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:9.5.5}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: nourax-search
      node.name: elasticsearch
      xpack.security.enabled: "true"
      # Plain HTTP inside the compose network; nothing outside the stack can reach the port.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # Features we don't use, switched off to save memory.
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      # Heap, then the JVM's own log: warnings only, to the container log (docker compose logs),
      # instead of the default GC log files inside the container (up to 2 GB, and file cache that
      # counts against the limit below). Last, once a minute the JVM gives the C memory it has
      # freed back to the system (glibc's malloc_trim). Without that, memory the Java compiler
      # used once and freed stays counted against the limit.
      ES_JAVA_OPTS: >-
        -Xms${ES_JAVA_HEAP:-512m} -Xmx${ES_JAVA_HEAP:-512m}
        -Xlog:disable -Xlog:all=warning:stderr:utctime,level,tags
        -XX:TrimNativeHeapInterval=60000
      # Fewer C memory pools (glibc arenas) for Elasticsearch's many threads: less memory outside
      # the heap on a small server.
      MALLOC_ARENA_MAX: "2"
      # The image refuses a password file that others can read: 50-search.sh keeps it at 0640.
      ELASTIC_PASSWORD_FILE: /run/secrets/elasticsearch_password
    secrets: [elasticsearch_password]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    # The Java heap (ES_JAVA_HEAP) plus Elasticsearch's own memory outside it. The limit and the
    # highest OOM score of the stack make the kernel stop the search engine first, never the
    # database or the file server. Search then waits; nothing is lost (the index is made from the files).
    mem_limit: ${ES_MEM_LIMIT:-1g}
    oom_score_adj: 600
    stop_grace_period: 2m
    healthcheck:
      # 401 means it is up and asks for a password; the check itself needs none.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -qx 401"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *logging

  # Background jobs that must not wait for the cron container's turn, in their own container with
  # their own memory limit, so a big document never takes memory from the file server. Today one
  # job: the search index of new, changed, shared and moved files, 2 minutes after each run ends
  # (config/elasticsearch/index-queue.sh). Between runs only that shell script is in memory.
  # Same image, files and settings as "cron" (extends), but no crond. Details: docs/search-and-antivirus.md.
  jobs:
    extends: cron
    user: www-data
    entrypoint: ["/bin/bash", "/opt/nourax/jobs/index-queue.sh"]
    environment:
      # Nextcloud's own minimum. A PHP run that needs more stops with an error in the log; the
      # container may also use as much swap as its limit before the kernel stops it.
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - ./config/elasticsearch/index-queue.sh:/opt/nourax/jobs/index-queue.sh:ro
    mem_limit: ${JOBS_MEM_LIMIT:-384m}
    oom_score_adj: 500
    # The image's own stop signal (SIGWINCH) is for Apache; the script stops on SIGTERM and
    # finishes a run that has started first.
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      # The script touches this file before every run; older than 65 minutes means it is stuck.
      test: ["CMD-SHELL", "find /tmp/nourax-jobs.alive -mmin -65 | grep -q ."]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m

  # Nourax AI for the Assistant: the relay to NIG on 8080 inside the compose network only (no port
  # is published). The file server's AI provider (integration_openai, set by
  # scripts/configure.d/50-assistant.sh) sends its requests here with the ai_relay_token; the relay
  # checks them, adds NIG's service key (nig_assistant_key, which never reaches the file server) and
  # sends them to NIG with "user" = the account id, so each one counts against that person's Nourax AI
  # budget. Refusals and failures come back as plain messages. Python standard library only, as
  # "nobody", read-only. Details: docs/assistant.md.
  ai-relay:
    image: ${AI_RELAY_IMAGE:-python:3.13.16-alpine3.24}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-I", "/opt/ai-relay/relay.py"]
    environment:
      NIG_URL: ${NIG_URL:-https://nig.nourax.org}
      NIG_KEY_FILE: /run/secrets/nig_assistant_key
      RELAY_TOKEN_FILE: /run/secrets/ai_relay_token
      NIG_FEATURE: assistant
      ALLOWED_MODELS: nourax-smart,nourax-long-context,nourax-fast
      # off: NIG gets whole-answer requests, so each one carries its token count and is charged.
      # Switch on (AI_RELAY_STREAM=on in .env) once NIG confirms streamed calls are charged too.
      NIG_STREAM: ${AI_RELAY_STREAM:-off}
      PYTHONDONTWRITEBYTECODE: "1"
    secrets: [ai_relay_token, nig_assistant_key]
    volumes:
      - ./ai-relay/relay.py:/opt/ai-relay/relay.py:ro
    # About 20 MB in use. The higher OOM score makes the kernel stop it before the database or the
    # file server; the Assistant then says it is busy.
    mem_limit: ${AI_RELAY_MEM_LIMIT:-64m}
    oom_score_adj: 300
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
    logging: *logging

  # The Assistant's AI tasks, run as soon as they are asked for (Nextcloud's occ taskprocessing:worker,
  # in ai-relay/ai-worker.sh); without it they wait for the cron container, up to 5 minutes. Same image,
  # files and settings as "cron" (extends), but no crond, with its own memory limit. While there is
  # nothing to do it holds one PHP process and asks the database every 2 seconds. Details: docs/assistant.md.
  ai-worker:
    extends: cron
    user: www-data
    entrypoint: ["/bin/bash", "/opt/nourax/ai/ai-worker.sh"]
    environment:
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - ./ai-relay/ai-worker.sh:/opt/nourax/ai/ai-worker.sh:ro
    mem_limit: ${AI_WORKER_MEM_LIMIT:-320m}
    oom_score_adj: 500
    # The image's own stop signal (SIGWINCH) is for Apache; the script stops on SIGTERM and lets a
    # task that has started finish first (a request to NIG takes at most 110 seconds).
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      # The script touches this file every time the worker starts again (every 5 minutes, later
      # while a long task runs); older than 15 minutes means it is stuck.
      test: ["CMD-SHELL", "find /tmp/nourax-ai-worker.alive -mmin -15 | grep -q ."]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 10s


  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on:
      app: { condition: service_started }
    networks:
      default:
        ipv4_address: 172.30.10.10
    logging: *logging

  # NoMail API services, if any, go below this line.

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  nextcloud:
  db:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:
  clamav_db:
  elasticsearch_data:

secrets:
  postgres_password:
    file: ${SECRETS_DIR}/postgres_password
  redis_password:
    file: ${SECRETS_DIR}/redis_password
  nextcloud_admin_user:
    file: ${SECRETS_DIR}/nextcloud_admin_user
  nextcloud_admin_password:
    file: ${SECRETS_DIR}/nextcloud_admin_password
  r2_access_key_id:
    file: ${SECRETS_DIR}/r2_access_key_id
  r2_secret_access_key:
    file: ${SECRETS_DIR}/r2_secret_access_key
  tunnel_token:
    file: ${SECRETS_DIR}/tunnel_token
  elasticsearch_password:
    file: ${SECRETS_DIR}/elasticsearch_password
  # Nourax AI for the Assistant (docs/assistant.md): made by scripts/configure.d/50-assistant.sh
  # (nig_assistant_key says "unset" until NIG's key is put in).
  ai_relay_token:
    file: ${SECRETS_DIR}/ai_relay_token
  nig_assistant_key:
    file: ${SECRETS_DIR}/nig_assistant_key
