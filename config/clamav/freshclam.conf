# freshclam settings for Nourax Workspace (compose service "clamav").
# Mounted read-only over the image's /etc/clamav/freshclam.conf, so this is the whole file. How
# often it checks comes from FRESHCLAM_CHECKS in compose.yaml (twice a day).
# Comments must stay on their own lines; freshclam reads anything after an option as its value.
# SPDX-License-Identifier: AGPL-3.0-or-later

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav

UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes

DatabaseMirror database.clamav.net
# Download only the changes to the daily signatures, not the whole file each time.
ScriptedUpdates yes
Bytecode yes

# Tell clamd (through its local socket) to load the new signatures.
NotifyClamd /etc/clamav/clamd.conf

# freshclam would load every new download into memory once as a test, next to clamd's own copy
# (about 1 GB). Both together would pass the container's memory limit on today's server.
# Switch this back to "yes" when the server has 8 GB (docs/search-and-antivirus.md).
TestDatabases no
