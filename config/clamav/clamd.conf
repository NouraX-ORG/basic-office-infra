# clamd settings for Nourax Workspace (compose service "clamav").
# Mounted read-only over the image's /etc/clamav/clamd.conf, so this is the whole file: every
# option not set here keeps clamd's default (see the clamd.conf(5) manual for ClamAV 1.5).
# Comments must stay on their own lines; clamd reads anything after an option as its value.
# SPDX-License-Identifier: AGPL-3.0-or-later

# Logs stay inside the container and rotate at 5 MB. Detections are also in the file server's log.
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
ExtendedDetectionInfo yes

DatabaseDirectory /var/lib/clamav

# The image's start script waits for this socket before it reports clamd as started.
LocalSocket /tmp/clamd.sock
# The file server and the NoMail API connect on TCP 3310. There is no TCPAddr line, so clamd
# listens on the container's own address too; no port is published, so only containers on the
# compose network can reach it.
TCPSocket 3310

User clamav
# Two CPUs on today's server: four scans at a time, the rest wait in the queue.
MaxThreads 4

# NoMail's scan API sends attachments of up to 95 MB in one stream. The file server sends at most
# 100 MiB per stream (av_stream_max_length) and starts a new stream for the rest of a bigger file.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 400M

# Load new signatures in place: scans wait during the reload (about a minute) instead of a second
# engine being loaded next to the first, which would need about twice the memory.
ConcurrentDatabaseReload no
# freshclam tells clamd when it has new signatures; this hourly check is the fallback.
SelfCheck 3600
